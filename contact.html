<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us - F1 Website</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background-image: url('images/f11.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      min-height: 100vh;
      color: #f2f2f2;
    }

    /* Overlay for readability */
    .overlay {
      background-color: rgba(12, 12, 12, 0.85);
      min-height: 100vh;
      padding-bottom: 3rem;
    }

    h1 {
      color: #e10600;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    /* Error message styling */
    .error-message {
      color: #ff6b6b;
      font-size: 0.9rem;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>

  <div class="overlay">
    <!-- Bootstrap Responsive Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark bg-opacity-75">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="#">
          <img src="images/F1.jpeg" alt="F1 Logo" width="40" height="40" class="me-2" />
          F1 Official
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index3.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="drivers.html">Drivers</a></li>
            <li class="nav-item"><a class="nav-link" href="schedule.html">Schedule</a></li>
            <li class="nav-item"><a class="nav-link" href="results.html">Results</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="contact.html">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Contact Form Container -->
    <div class="container my-5">
      <h1>Contact Us</h1>
      <form id="contactForm" action="#" method="post" class="bg-dark p-4 rounded" novalidate>
        <div class="mb-3">
          <label for="name" class="form-label fw-bold">Name:</label>
          <input
            type="text"
            class="form-control"
            id="name"
            name="name"
            placeholder="Your full name"
            required
          />
          <div id="nameError" class="error-message"></div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label fw-bold">Email:</label>
          <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            placeholder="your.email@example.com"
            required
          />
          <div id="emailError" class="error-message"></div>
        </div>

        <div class="mb-3">
          <label for="message" class="form-label fw-bold">Message:</label>
          <textarea
            class="form-control"
            id="message"
            name="message"
            placeholder="Write your message here..."
            rows="5"
            required
          ></textarea>
          <div id="messageError" class="error-message"></div>
        </div>

        <button type="submit" class="btn btn-danger w-100">Send Message</button>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Custom Validation Script -->
  <script>
    document.getElementById('contactForm').addEventListener('submit', function(event) {
      // Clear previous errors
      const nameError = document.getElementById('nameError');
      const emailError = document.getElementById('emailError');
      const messageError = document.getElementById('messageError');
      nameError.textContent = '';
      emailError.textContent = '';
      messageError.textContent = '';

      let isValid = true;

      // Validate Name: Not empty and only letters (basic)
      const name = document.getElementById('name').value.trim();
      if (name === '') {
        nameError.textContent = 'Name is required.';
        isValid = false;
      } else if (!/^[a-zA-Z\s]+$/.test(name)) {
        nameError.textContent = 'Name must contain only letters and spaces.';
        isValid = false;
      }

      // Validate Email: valid email format
      const email = document.getElementById('email').value.trim();
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (email === '') {
        emailError.textContent = 'Email is required.';
        isValid = false;
      } else if (!emailPattern.test(email)) {
        emailError.textContent = 'Please enter a valid email address.';
        isValid = false;
      }

      // Validate Message: Not empty and at least 10 characters
      const message = document.getElementById('message').value.trim();
      if (message === '') {
        messageError.textContent = 'Message is required.';
        isValid = false;
      } else if (message.length < 10) {
        messageError.textContent = 'Message must be at least 10 characters.';
        isValid = false;
      }

      if (!isValid) {
        event.preventDefault();  // Stop form submission
      }
    });
  </script>
</body>
</html>
