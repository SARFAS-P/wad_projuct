<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fake F1 Drivers</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    body {
      background-image: url('images/f11.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      min-height: 100vh;
      color: #f2f2f2;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Overlay for better readability */
    .overlay {
      background-color: rgba(12, 12, 12, 0.85);
      min-height: 100vh;
      padding-bottom: 3rem;
    }

    h1 {
      color: #e10600;
      margin-bottom: 2rem;
      text-align: center;
    }

    /* Style for driver images */
    .driver-img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #e10600;
      margin-right: 15px;
    }

    /* Table styling overrides */
    table {
      background-color: #1a1a1a;
      border-radius: 8px;
      overflow: hidden;
    }

    th {
      background-color: #e10600;
      color: white;
    }

    tr:hover {
      background-color: #2e2e2e;
    }
  </style>
</head>
<body>

  <div class="overlay">
    <!-- Responsive Navbar using Bootstrap -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark bg-opacity-75">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="#">
          <img src="images/F1.jpeg" alt="F1 Logo" width="40" height="40" class="me-2" />
          F1 Official
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index3.html">Home</a></li>
            <li class="nav-item"><a class="nav-link active" href="drivers.html">Drivers</a></li>
            <li class="nav-item"><a class="nav-link" href="schedule.html">Schedule</a></li>
            <li class="nav-item"><a class="nav-link" href="results.html">Results</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container my-5">
      <h1>Meet Our Top Drivers</h1>

      <div class="table-responsive rounded">
        <table class="table table-dark table-hover align-middle">
          <thead>
            <tr>
              <th scope="col">Driver</th>
              <th scope="col">Team</th>
              <th scope="col">Country</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="d-flex align-items-center">
                <img class="driver-img" src="images/max.jpeg" alt="Max Verstappen" />
                Max Verstappen
              </td>
              <td>Red Bull Racing</td>
              <td>USA</td>
            </tr>
            <tr>
              <td class="d-flex align-items-center">
                <img class="driver-img" src="images/hamilton.jpeg" alt="Lewis Hamilton" />
                Lewis Hamilton
              </td>
              <td>Mercedes</td>
              <td>UK</td>
            </tr>
            <tr>
              <td class="d-flex align-items-center">
                <img class="driver-img" src="images/lec.jpeg" alt="Charles Leclerc" />
                Charles Leclerc
              </td>
              <td>Ferrari</td>
              <td>France</td>
            </tr>
            <tr>
              <td class="d-flex align-items-center">
                <img class="driver-img" src="images/sains.jpg" alt="Carlos Sainz" />
                Carlos Sainz
              </td>
              <td>Williams Racing</td>
              <td>Germany</td>
            </tr>
            <tr>
              <td class="d-flex align-items-center">
                <img class="driver-img" src="images/alanso.png" alt="Fernando Alonso" />
                Fernando Alonso
              </td>
              <td>Aston Martin</td>
              <td>Spain</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
